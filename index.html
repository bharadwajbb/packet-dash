<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packet Dash</title>
  <meta name="description" content="A networking-themed platformer: deliver a packet across the network and learn ports, latency vs bandwidth, and lost-packet resends.">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='19' rx='4' fill='%232fd3ff'/%3E%3Crect x='5' y='9' width='22' height='4' fill='%230a4f66'/%3E%3Cpath d='M5 15 L16 21 L27 15' stroke='%230a3a4c' stroke-width='2' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#screen">Skip to game</a>
  <header class="topbar">
    <div class="brand" aria-label="Packet Dash">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">packet<span>_</span>dash</span>
      <span class="brand-sub">a networking platformer</span>
    </div>
    <nav class="toolbar" aria-label="Game controls">
      <button id="btn-hint" type="button" disabled title="Ask the admin for a hint (H)">? Ask the admin <kbd>H</kbd></button>
      <button id="btn-console" type="button" aria-pressed="false" title="Make every choice from a list, no jumping (C)">&gt;_ Console mode <kbd>C</kbd></button>
      <button id="btn-motion" type="button" aria-pressed="false">Reduce motion</button>
      <button id="btn-restart" type="button">↺ Restart</button>
    </nav>
  </header>

  <div class="pcap" role="group" aria-label="Packet header">
    <span class="pcap-tag" aria-hidden="true">PKT</span>
    <div id="headerbar" class="pcap-fields"></div>
  </div>

  <main id="screen" tabindex="-1">
    <section class="screen"><h1>Connecting…</h1><p>Loading level data.</p></section>
  </main>

  <section class="log" aria-labelledby="log-title">
    <h2 id="log-title" class="log-title">network log <span aria-hidden="true">· tail -f</span></h2>
    <div class="log-scroll" tabindex="0" aria-label="Network log, scrollable">
      <ol id="log-lines" role="log" aria-live="polite" aria-relevant="additions"></ol>
    </div>
  </section>

  <noscript><p class="screen">Packet Dash needs JavaScript. Serve this folder with <code>python3 start.py</code>.</p></noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
